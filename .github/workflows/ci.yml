name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [userservice, bookservice, loanservice, apigatewayservice]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.service }}
        run: go test ./... -race